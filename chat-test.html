<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro & More — Knowledge Base Chat Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 680px;
    }
    .header {
      background: #2d6a2d;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon { font-size: 28px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
    .filter-bar {
      padding: 10px 16px;
      background: #f8faf8;
      border-bottom: 1px solid #e5ece5;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #c8d8c8;
      background: white;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #2d6a2d;
      color: white;
      border-color: #2d6a2d;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      display: flex;
      gap: 8px;
      max-width: 90%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .msg.user .bubble {
      background: #2d6a2d;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: #f0f4f0;
      color: #222;
      border-bottom-left-radius: 4px;
    }
    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg.user .avatar { background: #2d6a2d; color: white; font-size: 12px; font-weight: 700; }
    .msg.bot  .avatar { background: #e0ece0; }
    .result-card {
      background: white;
      border: 1px solid #d4e4d4;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      font-size: 13px;
    }
    .result-card .cat-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #e8f4e8;
      color: #2d6a2d;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .result-card h3 { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 5px; }
    .result-card p  { font-size: 12.5px; color: #444; line-height: 1.5; }
    .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      font-size: 10px;
      background: #f0f0f0;
      color: #666;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .typing {
      display: flex; gap: 4px; align-items: center;
      padding: 10px 14px;
      background: #f0f4f0;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }
    .dot {
      width: 7px; height: 7px;
      background: #2d6a2d;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #e5ece5;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #c8d8c8;
      border-radius: 24px;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-area input:focus { border-color: #2d6a2d; }
    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #2d6a2d;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .send-btn:hover { background: #1e4d1e; }
    .send-btn:disabled { background: #aaa; cursor: not-allowed; }
    .suggestion-chips {
      padding: 8px 16px 0;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chip {
      font-size: 11.5px;
      padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid #c8d8c8;
      background: white;
      color: #2d6a2d;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { background: #e8f4e8; border-color: #2d6a2d; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-icon">🌿</div>
    <div>
      <h1>Agro & More Chat</h1>
      <p>Ask a farming question — live API test</p>
    </div>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-cat="">All topics</button>
    <!-- categories loaded dynamically -->
  </div>

  <div class="suggestion-chips" id="chips">
    <button class="chip" onclick="ask('maize stalk borer')">Maize stalk borer</button>
    <button class="chip" onclick="ask('tomato blight')">Tomato blight</button>
    <button class="chip" onclick="ask('fertiliser planting')">Fertiliser tips</button>
    <button class="chip" onclick="ask('current produce prices')">Produce prices</button>
    <button class="chip" onclick="ask('how to order inputs')">Order inputs</button>
    <button class="chip" onclick="ask('planting season maize')">Planting season</button>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="avatar">🌿</div>
      <div class="bubble">
        Hello! I'm the Agro & More knowledge assistant. Ask me anything about farming, pests, prices, or our products.
      </div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="questionInput" placeholder="Ask a farming question…" autocomplete="off" />
    <button class="send-btn" id="sendBtn" onclick="sendQuestion()">➤</button>
  </div>
</div>

<script>
  const API = 'https://agro-more-ussd.onrender.com';
  let activeCategory = '';

  // Load categories into filter bar
  fetch(`${API}/chat/categories`)
    .then(r => r.json())
    .then(({ categories }) => {
      const bar = document.getElementById('filterBar');
      categories.forEach(({ key, label }) => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = key;
        btn.textContent = label;
        btn.onclick = () => setCategory(key, btn);
        bar.appendChild(btn);
      });
    });

  function setCategory(cat, btn) {
    activeCategory = activeCategory === cat ? '' : cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (activeCategory) btn.classList.add('active');
    else document.querySelector('[data-cat=""]').classList.add('active');
  }

  document.getElementById('questionInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendQuestion();
  });

  function ask(q) {
    document.getElementById('questionInput').value = q;
    sendQuestion();
  }

  async function sendQuestion() {
    const input = document.getElementById('questionInput');
    const question = input.value.trim();
    if (!question) return;

    // Hide chips after first question
    document.getElementById('chips').style.display = 'none';

    addMessage('user', question);
    input.value = '';
    document.getElementById('sendBtn').disabled = true;

    const typingId = addTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, category: activeCategory || null }),
      });
      const data = await res.json();

      removeTyping(typingId);

      if (!data.success || data.total === 0) {
        addMessage('bot', data.message);
      } else {
        addMessage('bot', data.message);
        data.results.forEach(r => addResultCard(r));
      }
    } catch (e) {
      removeTyping(typingId);
      addMessage('bot', '⚠️ Could not reach the server. Check your connection.');
    }

    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  function addMessage(role, text) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? 'You' : '🌿'}</div>
      <div class="bubble">${escHtml(text)}</div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addResultCard(r) {
    const msgs = document.getElementById('messages');
    const tagsHtml = (r.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `
      <div class="avatar">🌿</div>
      <div class="result-card">
        <span class="cat-badge">${escHtml(r.category_label)}</span>
        <h3>${escHtml(r.title)}</h3>
        <p>${escHtml(r.content)}</p>
        ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
      </div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  let typingCounter = 0;
  function addTyping() {
    const id = 'typing-' + (++typingCounter);
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg bot'; div.id = id;
    div.innerHTML = `<div class="avatar">🌿</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
